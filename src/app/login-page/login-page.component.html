<div class="login-container">

  <mat-card class="login-card">

    <mat-card-header>
      <mat-card-title>
        Iniciar sesión
      </mat-card-title>

      <mat-card-subtitle>
        Accede a tu cuenta
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <form
        [formGroup]="formulario"
        (ngSubmit)="iniciarSesion()"
      >

        <mat-form-field appearance="outline">
          <mat-label>Correo</mat-label>

          <input
            matInput
            type="email"
            formControlName="correo"
            autocomplete="email"
          >

          <mat-error
            *ngIf="
              formulario.controls.correo.hasError('required')
            "
          >
            El correo es obligatorio.
          </mat-error>

          <mat-error
            *ngIf="
              formulario.controls.correo.hasError('email')
            "
          >
            Escribe un correo válido.
          </mat-error>
        </mat-form-field>


        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>

          <input
            matInput
            type="password"
            formControlName="clave"
            autocomplete="current-password"
          >

          <mat-error
            *ngIf="
              formulario.controls.clave.hasError('required')
            "
          >
            La contraseña es obligatoria.
          </mat-error>
        </mat-form-field>


        <p
          *ngIf="error()"
          class="mensaje-error"
          role="alert"
        >
          {{ error() }}
        </p>


        <button
          mat-raised-button
          type="submit"
          [disabled]="cargando()"
        >

          <mat-progress-spinner
            *ngIf="cargando()"
            mode="indeterminate"
            diameter="20"
          ></mat-progress-spinner>

          <span *ngIf="!cargando()">
            Iniciar sesión
          </span>

          <span *ngIf="cargando()">
            Iniciando sesión...
          </span>

        </button>

      </form>

    </mat-card-content>

    <mat-card-actions>
      <a
        mat-button
        routerLink="/registro"
      >
        Crear una cuenta
      </a>
    </mat-card-actions>

  </mat-card>

</div>
