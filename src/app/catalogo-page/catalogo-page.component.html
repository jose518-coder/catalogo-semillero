<h1>Catálogo de productos</h1>
<div class="resumen-carrito">
  <p>Ítems en carrito:{{ cantidadCarrito() }}</p>
  <p>Total:${{ totalCarrito() }}</p>
  <a routerLink="/carrito">Ver carrito</a>
</div>
<hr>

<label for="categoria">Categoría:</label>
<select id="categoria" [value]="categoriaSeleccionada() ?? ''" (change)=" cambiarCategoria( $any($event.target).value ) ">
  <option value=""> Todas</option>
  <option *ngFor=" let categoria of categorias$ | async " [value]="categoria.id"> {{ categoria.name }} </option>
</select>
<hr>
<p *ngIf="cargando()"> Cargando productos... </p>
<p *ngIf="errorProductos()" class="error" > {{ errorProductos() }}
</p>
<div *ngIf=" productos$ | async as productos ">
  <p *ngIf=" !errorProductos() && productos.length === 0 "> No hay productos disponibles. </p>
  <div class="catalogo">
    <div *ngFor=" let producto of productos; trackBy: trackById ">
      <app-tarjeta-producto [producto]="producto" (agregarAlCarrito)=" onAgregarAlCarrito($event) "></app-tarjeta-producto>
      <a [routerLink]="[ '/productos', producto.id ]" > Ver detalle </a>
    </div>
  </div>
</div>
<hr>
<div class="paginacion">
  <button (click)="cambiarPagina(1)"> Página 1</button>
  <button (click)="cambiarPagina(2)" > Página 2 </button>
  <button (click)="cambiarPagina(3)" > Página 3 </button>
</div>
