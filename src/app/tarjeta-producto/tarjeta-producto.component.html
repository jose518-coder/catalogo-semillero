<mat-card class="tarjeta">

  <img *ngIf="producto.imagenes.length" mat-card-image [src]="producto.imagenes[0]" [alt]="producto.titulo">

  <mat-card-header><mat-card-title> {{ producto.titulo }} </mat-card-title>
    <mat-card-subtitle> {{ producto.categoria }} </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="precio"> ${{ producto.precio }} </p>
    <p> {{ producto.descripcion }} </p>
    <p> Stock: {{ producto.existencias }} </p>
    <span *ngIf="producto.existencias === 0" class="agotado"> Agotado </span>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button type="button" [disabled]="producto.existencias === 0" (click)="agregarAlCarrito.emit(producto)" > Agregar al carrito </button>
  </mat-card-actions>
</mat-card>
