<div class="tabla-container">
  <table
    mat-table
    [dataSource]="dataSource"
    class="tabla-productos"
  >
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let producto"> {{ producto.id }} </td>
    </ng-container>

    <ng-container matColumnDef="imagen">
      <th mat-header-cell *matHeaderCellDef> Imagen </th>
      <td mat-cell *matCellDef="let producto">
        <img
          [src]="producto.images[0]"
          [alt]="producto.title"
          class="imagen-producto"
        >
      </td>
    </ng-container>
 
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let producto"> {{ producto.title }} </td>
    </ng-container>


    <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef>
        Categoría
      </th>

      <td mat-cell *matCellDef="let producto">
        {{ producto.category.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef> Precio </th>
      <td mat-cell *matCellDef="let producto"> ${{ producto.price }} </td>
    </ng-container>
  
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let producto">
        <button
          mat-icon-button
          type="button"
          aria-label="Editar producto"
          (click)="editar.emit(producto)"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          aria-label="Eliminar producto"
          (click)="eliminar.emit(producto)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  
  <mat-paginator
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Paginación de productos"
  >
  </mat-paginator>
  <p *ngIf="productosVacios()"> No hay productos disponibles.</p>
</div>
